<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrasi - HexaCare</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <a class="brand auth-brand" href="/"><span>HC</span>HexaCare</a>
      <form class="auth-card" method="post" action="/Registrasi/">
        <p class="eyebrow">Registrasi</p>
        <h1>Buat akun HexaCare</h1>
        $alert
        <label>Nama Lengkap<input type="text" name="name" placeholder="Nama kamu" required></label>
        <label>Email<input type="email" name="email" placeholder="nama@email.com" required></label>
        <label>Password<input type="password" name="password" placeholder="Minimal 6 karakter" required></label>
        <button class="primary-button full-button" type="submit">Daftar</button>
        <p class="form-note">Sudah punya akun? <a href="/Login/">Login di sini</a>.</p>
      </form>
    </main>
  </body>
</html>
